name: Build and Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build & Test (.NET 9)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x

    - name: Restore Dependencies
      run: dotnet restore EndpointPulse.sln

    - name: Build Solution
      run: dotnet build EndpointPulse.sln --no-restore --configuration Release

    - name: Run Unit Tests
      run: dotnet test EndpointPulse.sln --no-build --configuration Release --verbosity normal
